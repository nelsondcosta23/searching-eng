services:
  python_scraper:
    container_name: python_scraper
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: 4gb
    volumes:
      - .:/app
      - ./database:/app/database
      - ./logs:/app/logs
    env_file:
      - .env
    working_dir: /app
    # Inicia o cron e mantém o container vivo. Env vars são propagadas para o
    # cron via /etc/environment (PAM-loaded by `service cron start`).
    command: bash -c "env > /etc/environment && service cron start && tail -f /dev/null"
    healthcheck:
      test: ["CMD", "pgrep", "cron"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  streamlit_app:
    container_name: streamlit_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: 2gb
    volumes:
      - .:/app
      - ./database:/app/database
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /app
    ports:
      - "127.0.0.1:8501:8501"   # bind to loopback only — dashboard has no auth
    command: streamlit run /app/app/job_dashboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    depends_on:
      python_scraper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8501/_stcore/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  job_api:
    container_name: job_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - .:/app
      - ./database:/app/database
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /app
    ports:
      - "8080:8080"
    # --reload disabled (audit Fase F #35) — file watching has zero value in
    # production and triggers restart loops on bind-mount churn. Run with
    # multiple workers instead. Set UVICORN_WORKERS=1 to disable parallelism.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080 --workers ${UVICORN_WORKERS:-2}
    depends_on:
      python_scraper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflare_tunnel:
    container_name: cloudflare_tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Quick Tunnel mode — generates an ephemeral *.trycloudflare.com URL on
    # every restart. For a stable public hostname, migrate to a Named Tunnel
    # (see CLOUDFLARE_TUNNEL.md). The Quick Tunnel is fine for development /
    # demoing but should not be used as a production dependency.
    command: tunnel --url http://job_api:8080
    depends_on:
      job_api:
        condition: service_healthy