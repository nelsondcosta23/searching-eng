name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Run tests
        env:
          API_KEY: "ci-test-key-AAAA1111BBBB2222CCCC3333"
          METRICS_ENABLED: "0"
          SENTRY_DSN: ""
          REDIS_URL: ""
          LOG_LEVEL: "error"
          VALID_JOB_PROFILES: "tech,data,design,engineering,marketing,hr,finance,sales,generalist"
        run: python -m pytest tests/ -v --tb=short
